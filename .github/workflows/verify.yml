name: Verify Aster

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and package
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Renderer/package-lock.json
      - name: Check project files
        run: |
          git diff-tree --root -r --check HEAD
          for script in build.sh test.sh scripts/package.sh scripts/macos-notary.sh; do bash -n "$script"; done
          for plist in Config/*.plist Config/*.entitlements Config/*.xcprivacy; do plutil -lint "$plist"; done
      - name: Build and run tests
        run: ./build.sh
      - name: Verify release archives
        run: ./scripts/package.sh --check "$RUNNER_TEMP/aster-dist"
