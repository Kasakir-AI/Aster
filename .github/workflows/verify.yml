name: Verify Aster

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and package
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Renderer/package-lock.json
      - name: Check project files
        run: |
          git diff-tree --root -r --check HEAD
          for script in build.sh test.sh scripts/package.sh scripts/macos-notary.sh; do bash -n "$script"; done
          for plist in Config/*; do plutil -lint "$plist"; done
      - name: Build and run tests
        run: ./build.sh
      - name: Verify release archives
        run: ./scripts/package.sh --check "$RUNNER_TEMP/aster-dist"
